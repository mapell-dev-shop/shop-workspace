[project]
name = "shop-workspace"
version = "0.1.0"
description = "Ties the shop services together: Kafka, scripts and end to end tests."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "httpx2>=2.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The end-to-end tests live in e2e/ and need the running shop: uv run pytest e2e
testpaths = ["tests"]
